<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Participation{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#9989;</text></svg>">
</head>
<body>
  <header class="topbar">
    <nav>
      <a href="/" class="{{ 'here' if nav == 'scores' }}">Scores</a>
      <a href="/courses" class="{{ 'here' if nav == 'courses' }}">Courses</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
