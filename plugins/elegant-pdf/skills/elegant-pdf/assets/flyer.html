<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="theme.css">
</head>
<!-- FLYER TEMPLATE — a single .sheet. Export to a 2x JPEG or 1-page PDF.
     Edit the content; keep the component classes (.eyebrow/.display/.rule/
     .meta-inline/.subline/.section-head/.item/.chip/.sheet-foot). -->
<body>
  <div class="sheet">
    <div class="eyebrow">Eyebrow line &nbsp;&middot;&nbsp; Date</div>
    <h1 class="display">Main Title<br>Second Line</h1>

    <div class="meta-inline">
      <span>Detail one</span>
      <span class="dot">&bull;</span>
      <span>Detail two</span>
      <span class="dot">&bull;</span>
      <span>Detail three</span>
    </div>
    <div class="subline">led by <b>Name</b></div>

    <div class="rule"></div>

    <div class="section-head"><span class="label">Group 1</span><span class="dates">Range</span></div>
    <div class="item"><div class="chip">TAG</div><div><div class="item-title">Item title</div><div class="item-desc">Short description of the item.</div></div></div>
    <div class="item"><div class="chip">TAG</div><div><div class="item-title">Item title</div><div class="item-desc">Short description of the item.</div></div></div>

    <div class="section-head" style="margin-top:20px;"><span class="label">Group 2</span><span class="dates">Range</span></div>
    <div class="item"><div class="chip">TAG</div><div><div class="item-title">Item title</div><div class="item-desc">Short description of the item.</div></div></div>

    <div class="sheet-foot">
      <a class="url" href="https://example.com">example.com</a>
      <span class="note">Secondary note</span>
    </div>
  </div>
</body>
</html>
